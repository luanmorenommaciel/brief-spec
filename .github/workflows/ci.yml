name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test and verification tools
        run: >-
          python -m pip install --disable-pip-version-check
          -e .
          "jsonschema>=4.23"
          "pytest>=8.4"
          "pytest-cov>=6.2"
          "ruff>=0.12"
      - name: Verify release surfaces
        run: python scripts/verify-release.py
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest --cov=briefspec --cov-report=term-missing

  plugin-hosts:
    name: Codex and Claude plugin validators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install structural verifier
        run: python -m pip install --disable-pip-version-check "jsonschema>=4.23"
      - name: Verify release surfaces
        run: python scripts/verify-release.py
      - name: Install current public host CLIs
        run: npm install --global @openai/codex @anthropic-ai/claude-code
      - name: Codex plugin validator
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: |
          mkdir -p "$CODEX_HOME"
          codex plugin marketplace add "$GITHUB_WORKSPACE" --json
          codex plugin add briefspec@briefspec --json
          codex plugin list
      - name: Claude plugin validator
        run: |
          claude plugin validate .claude-plugin/plugin.json --strict
          claude plugin validate .claude-plugin/marketplace.json --strict

  codex-project-hooks:
    name: Codex project hooks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install project and test tools
        run: >-
          python -m pip install --disable-pip-version-check
          -e .
          "pytest>=8.4"
      - name: Execute project hooks from a nested directory
        run: >-
          python -m pytest
          tests/test_installer_failure_paths.py::test_codex_project_hook_executes_from_nested_directory

  release:
    name: Build and clean-room installation
    needs: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install build tools
        run: >-
          python -m pip install --disable-pip-version-check
          "build>=1.3"
          "jsonschema>=4.23"
          "twine>=6.1"
      - name: Build distributions
        run: python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Verify wheel resource projections
        run: |
          wheel="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          python scripts/verify-release.py --wheel "$wheel"
      - name: Clean-room install smoke
        run: |
          wheel="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          smoke_env="$RUNNER_TEMP/briefspec-smoke"
          smoke_project="$RUNNER_TEMP/briefspec-project"
          smoke_state="$RUNNER_TEMP/briefspec-state"
          python -m venv "$smoke_env"
          "$smoke_env/bin/python" -m pip install --disable-pip-version-check --no-deps "$wheel"
          mkdir -p "$smoke_project"
          BRIEFSPEC_HOME="$smoke_state" "$smoke_env/bin/briefspec" --version
          BRIEFSPEC_HOME="$smoke_state" "$smoke_env/bin/briefspec" \
            install all --scope project --project "$smoke_project"
          BRIEFSPEC_HOME="$smoke_state" "$smoke_env/bin/briefspec" \
            doctor all --scope project --project "$smoke_project" --probe
          test -f "$smoke_project/.codex/briefspec/briefspec.pyz"
          test -f "$smoke_project/.claude/briefspec/briefspec.pyz"
          test -f "$smoke_project/.github/briefspec/briefspec.pyz"
