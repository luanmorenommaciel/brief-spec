name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build the release artifact once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Verify tag and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python -c "import os,tomllib;
          version=tomllib.load(open('pyproject.toml','rb'))['project']['version'];
          expected=f'v{version}';
          assert os.environ['RELEASE_TAG']==expected,
          f'tag {os.environ[\"RELEASE_TAG\"]!r} does not match {expected!r}'"
      - name: Install build and verification tools
        run: >-
          python -m pip install --disable-pip-version-check
          "build>=1.3"
          "jsonschema>=4.23"
          "twine>=6.1"
      - name: Verify source release surfaces
        run: python scripts/verify-release.py
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Verify built wheel
        run: |
          wheel="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          python scripts/verify-release.py --wheel "$wheel"
      - name: Record SHA-256 checksums
        run: |
          cd dist
          sha256sum ./*.whl ./*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: briefspec-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish verified GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: briefspec-${{ github.ref_name }}
          path: dist/
      - name: Generate build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Create versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "BriefSpec ${GITHUB_REF_NAME#v}"
          --generate-notes
